<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#20252b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Merkür Saha"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>Merkür Mobil • Saha</title><style>
:root{--c:#B87333;--dark:#20252b;--bg:#f3f4f6;--ok:#198754;--danger:#c0392b;--warn:#b7791f}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#252525}.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}.top{position:sticky;top:0;z-index:5;background:var(--dark);color:#fff;padding:16px 18px 14px}.brand{font-weight:900;font-size:20px}.sub{opacity:.72;font-size:12px;margin-top:3px}.sync{font-size:11px;margin-top:7px}.body{padding:16px 16px 92px}.card{background:#fff;border:1px solid #e4e4e4;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.05)}h2{font-size:20px;margin:0 0 12px}label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}input,select,textarea{width:100%;padding:13px 12px;border:1px solid #cfd3d8;border-radius:10px;font-size:16px;background:#fff}textarea{min-height:80px;resize:vertical}.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:800;font-size:15px;cursor:pointer}.wide{width:100%;margin-top:14px}.primary{background:var(--c);color:#fff}.green{background:var(--ok);color:#fff}.red{background:var(--danger);color:#fff}.ghost{background:#eceff2;color:#222}.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice .ship{grid-column:1/-1}.choice button{height:105px;font-size:18px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid #ddd;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:none;padding:8px 4px;font-size:12px;font-weight:700}.nav .ico{display:block;font-size:22px;margin-bottom:3px}.hidden{display:none!important}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.Bekliyor{background:#fff3cd;color:#856404}.Onaylandı{background:#d1e7dd;color:#0f5132}.Reddedildi{background:#f8d7da;color:#842029}.item{border:1px solid #e2e5e8;border-radius:13px;padding:13px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.muted{font-size:12px;color:#6b7280}.strong{font-weight:800}.actions{display:flex;gap:8px;margin-top:11px}.actions button{flex:1;padding:10px}.login{min-height:100vh;display:flex;align-items:center;padding:24px;background:#20252b}.loginbox{width:100%;background:#fff;border-radius:18px;padding:22px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#20252b;color:#fff;padding:11px 14px;border-radius:10px;z-index:30;font-size:13px;max-width:90%;display:none}.stockinfo{background:#f7f1eb;border-left:4px solid var(--c);padding:10px 12px;border-radius:8px;margin-top:8px;font-size:13px}
.filters{display:flex;gap:7px;overflow:auto;padding:4px 0 10px}.filter{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 11px;font-weight:700}.filter.active{background:var(--dark);color:#fff}.adminOnly{display:none}.admin .adminOnly{display:block}.search{margin:8px 0 4px}.mini{font-size:12px;padding:8px 10px}.adminActions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}</style></head><body><div id="login" class="login"><div class="loginbox"><h2>MERKÜR Mobil</h2><div class="muted">Saha stok ve sevkiyat terminali</div><label>Kullanıcı adı</label><input id="lu" autocomplete="username"><label>Şifre</label><input id="lp" type="password" autocomplete="current-password"><button class="btn primary wide" onclick="login()">Giriş Yap</button><div id="loginStatus" class="muted" style="margin-top:12px">Bulut verileri yükleniyor…</div></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand">MERKÜR • SAHA</div><div id="who" class="sub"></div><div id="sync" class="sync">🟡 Bağlanıyor…</div></header><main class="body">
<section id="home"><div class="card"><h2>Yeni İşlem</h2><div class="choice"><button class="btn green" onclick="newReq('Giriş')">📥<br>STOK GİRİŞİ</button><button class="btn red" onclick="newReq('Çıkış')">📤<br>STOK ÇIKIŞI</button><button class="btn primary ship" onclick="newReq('Sevkiyat')">🚚<br>ÜRÜN SEVKİ</button></div></div><div class="card"><div class="row"><div><div class="strong">Bekleyen Taleplerim</div><div class="muted">Admin onayından önce düzenlenebilir</div></div><div id="pendingN" style="font-size:30px;font-weight:900;color:var(--c)">0</div></div></div></section>
<section id="form" class="hidden"><div class="card"><h2 id="formTitle">Stok İşlemi</h2><input id="editId" type="hidden"><label>İşlem Türü</label><select id="type"><option>Giriş</option><option>Çıkış</option><option>Sevkiyat</option></select><label>Stok / Ürün</label><input id="mat" list="names" placeholder="Adını veya stok kodunu yazın" oninput="smartMatch()" autocomplete="off"><datalist id="names"></datalist><input id="code" type="hidden"><datalist id="codes"></datalist><div id="stockInfo" class="stockinfo hidden"></div><label>Miktar</label><input id="qty" type="number" inputmode="decimal" min="0.0001" step="any" placeholder="0"><label id="companyLabel">Firma / Tedarikçi (isteğe bağlı)</label><input id="company"><label>Evrak / İrsaliye No (isteğe bağlı)</label><input id="doc"><label>Açıklama (isteğe bağlı)</label><textarea id="desc"></textarea><button class="btn primary wide" onclick="saveReq()" id="saveBtn">Onaya Gönder</button><button class="btn ghost wide" onclick="show('home')">Vazgeç</button></div></section>
<section id="mine" class="hidden"><div class="card"><div class="row"><div><h2>Gönderdiklerim</h2><div class="muted">Bekleyen kayıtları admin işlem yapana kadar düzeltebilirsin.</div></div><button class="btn ghost" onclick="refresh()">↻</button></div><div id="list"></div></div></section>

<section id="admin" class="hidden adminOnly"><div class="card"><div class="row"><div><h2>Onay Defteri</h2><div class="muted">Mobil yönetici ekranı</div></div><button class="btn ghost" onclick="refresh()">↻</button></div><input id="adminSearch" class="search" placeholder="Stok, ürün, personel ara..." oninput="renderAdmin()"><div class="filters" id="catFilters"><button class="filter active" onclick="setCat('Tümü',this)">Tümü</button><button class="filter" onclick="setCat('Hammadde',this)">Hammadde</button><button class="filter" onclick="setCat('Ürün',this)">Ürün</button><button class="filter" onclick="setCat('Mamul',this)">Mamul</button></div><div class="filters" id="statusFilters"><button class="filter active" onclick="setStatus('Tümü',this)">Tümü</button><button class="filter" onclick="setStatus('Bekliyor',this)">Bekleyen</button><button class="filter" onclick="setStatus('Onaylandı',this)">Onaylandı</button><button class="filter" onclick="setStatus('Reddedildi',this)">Reddedildi</button></div><div id="adminList"></div></div></section>
</main><nav class="nav"><button onclick="show('home')"><span class="ico">⌂</span>Ana Sayfa</button><button onclick="newReq('Giriş')"><span class="ico">＋</span>Yeni İşlem</button><button onclick="show('mine')"><span class="ico">☷</span>Gönderdiklerim</button><button id="adminNav" class="adminOnly" onclick="show('admin')"><span class="ico">✓</span>Onaylar</button></nav></div><div id="toast" class="toast"></div>
<script>
const URL='https://rtnrbuydjbaluorsljqv.supabase.co', KEY='sb_publishable_tDqC-wtkHK1Alet6KKqYrw_BvuEfwhZ', TABLE='stok_verileri', ROW='sistem_data';
let state=null,user=null,lastUpdated=null,catFilter='Tümü',statusFilter='Tümü';
const API=URL+'/rest/v1/'+TABLE;
async function apiFetch(url,opt={}){const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),10000);try{return await fetch(url,{...opt,signal:ctrl.signal,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal',...(opt.headers||{})}})}finally{clearTimeout(timer)}}
const $=id=>document.getElementById(id), clone=x=>JSON.parse(JSON.stringify(x));
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2400)}
async function read(){const r=await apiFetch(API+'?select=veri,updated_at&kod=eq.'+encodeURIComponent(ROW),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error('Bulut okuma hatası: '+r.status);const a=await r.json();return a[0]||null}
async function boot(){try{$('loginStatus').textContent='🟡 Buluta bağlanıyor…';let r=await read();state=r?.veri||{};lastUpdated=r?.updated_at||null;$('loginStatus').textContent='🟢 Sistem hazır';return true}catch(e){console.error(e);$('loginStatus').textContent='🔴 Bulut bağlantısı kurulamadı • '+(e.name==='AbortError'?'zaman aşımı':e.message);return false}}
async function login(){try{if(!state){const ok=await boot();if(!ok)return toast('Bulut bağlantısı kurulamadı')}const k=$('lu').value.trim(),p=$('lp').value;const u=state?.users?.[k];if(!u||u.pass!==p)return toast('Kullanıcı adı veya şifre hatalı');user={username:k,...u};$('who').textContent=user.name+' • '+user.username;$('login').classList.add('hidden');$('app').classList.remove('hidden');if(isAdmin()){$('app').classList.add('admin');document.querySelector('.nav').style.gridTemplateColumns='repeat(4,1fr)'}apply();await refresh();}catch(e){toast('Bağlantı hatası')}}
function isAdmin(){return !!user&&(user.role==='admin'||user.admin===true||user.username==='admin'||String(user.name||'').toLowerCase().includes('admin'))}
function apply(){let mats=state?.materials||[];$('codes').innerHTML=mats.map(m=>`<option value="${esc(m.code)}">${esc(m.name)}</option>`).join('');$('names').innerHTML=mats.flatMap(m=>[`<option value="${esc(m.name)}">${esc(m.code)}</option>`,`<option value="${esc(m.code)}">${esc(m.name)}</option>`]).join('');renderMine();renderAdmin()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(id){['home','form','mine','admin'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='mine')refresh();renderMine();renderAdmin()}
function newReq(t){$('editId').value='';$('type').value=t;$('code').value='';$('mat').value='';$('qty').value='';$('company').value='';$('doc').value='';$('desc').value='';$('stockInfo').classList.add('hidden');$('formTitle').textContent=t==='Giriş'?'📥 Stok Girişi':t==='Çıkış'?'📤 Stok Çıkışı':'🚚 Ürün Sevki';$('companyLabel').textContent=t==='Sevkiyat'?'Müşteri / Sevk Yeri (isteğe bağlı)':'Firma / Tedarikçi (isteğe bağlı)';$('saveBtn').textContent='Onaya Gönder';show('form')}
function smartMatch(){const q=$('mat').value.trim().toLowerCase();const m=(state?.materials||[]).find(x=>String(x.code).toLowerCase()===q||String(x.name).toLowerCase()===q);$('code').value=m?m.code:'';if(m){let cur=stockOf(m.code);$('stockInfo').innerHTML=`<b>✓ Eşleşti: ${esc(m.code)} • ${esc(m.name)}</b><br>Mevcut stok: ${fmt(cur)} ${esc(m.unit||'')}`;$('stockInfo').classList.remove('hidden')}else if(q){$('stockInfo').innerHTML='<b>⚠ Kayıtlı stok/ürünle eşleşmedi.</b><br>Bu yazdığınız şekliyle admin onayına gönderilecek.';$('stockInfo').classList.remove('hidden')}else $('stockInfo').classList.add('hidden')}
function fillMaterial(){const m=(state?.materials||[]).find(x=>String(x.code).toLowerCase()===$('code').value.trim().toLowerCase());if(m){$('mat').value=m.name;let cur=stockOf(m.code);$('stockInfo').innerHTML=`<b>${esc(m.code)} • ${esc(m.name)}</b><br>Mevcut stok: ${fmt(cur)} ${esc(m.unit||'')}`;$('stockInfo').classList.remove('hidden')}else $('stockInfo').classList.add('hidden')}
function stockOf(code){const m=(state?.materials||[]).find(x=>x.code===code);if(!m)return 0;let v=Number(m.init||0);(state?.movements||[]).filter(x=>x.code===code).forEach(x=>{let q=Number(x.qty||0);v+=x.type==='Giriş'?q:x.type==='Çıkış'?-q:0});return v}
function fmt(n){return Number(n||0).toLocaleString('tr-TR',{maximumFractionDigits:3})}
async function mutateApprovals(fn){$('sync').textContent='🟡 Güncelleniyor…';let r=await read();let fresh=clone(r?.veri||{});fresh.approvals=Array.isArray(fresh.approvals)?fresh.approvals:[];fn(fresh.approvals,fresh);const now=new Date().toISOString();const wr=await apiFetch(API+'?on_conflict=kod',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({kod:ROW,veri:fresh,updated_at:now})});if(!wr.ok)throw new Error('Bulut kayıt hatası: '+wr.status);state=fresh;lastUpdated=now;$('sync').textContent='🟢 Senkronize';apply()}
async function saveReq(){let q=Number(String($('qty').value).replace(',','.'));if(!$('mat').value.trim())return toast('Malzeme / ürün adı gerekli');if(!Number.isFinite(q)||q<=0)return toast('Geçerli bir miktar gir');let eid=Number($('editId').value||0);try{await mutateApprovals(arr=>{if(eid){let a=arr.find(x=>Number(x.id)===eid);if(!a||a.status!=='Bekliyor'||(!owned(a)&&!isAdmin()))throw new Error('Bu kayıt artık düzenlenemez');a.type=$('type').value;a.code=$('code').value.trim();a.materialName=$('mat').value.trim();a.unmatched=!$('code').value.trim();a.qty=q;a.company=$('company').value.trim()||'-';a.doc=$('doc').value.trim()||'-';a.desc=$('desc').value.trim()||'-';a.editedBy=user.name;a.editedAt=new Date().toISOString()}else arr.push({id:Date.now(),date:new Date().toISOString().slice(0,10),user:user.name,ownerUsername:user.username,type:$('type').value,materialName:$('mat').value.trim(),code:$('code').value.trim(),unmatched:!$('code').value.trim(),company:$('company').value.trim()||'-',qty:q,doc:$('doc').value.trim()||'-',desc:$('desc').value.trim()||'-',status:'Bekliyor',source:'Mobil Saha'});});toast(eid?'Talep güncellendi':'Talep admin onayına gönderildi');show('mine')}catch(e){$('sync').textContent='🔴 Kayıt başarısız';toast(e.message||'Kayıt yapılamadı')}}
function owned(a){return a.ownerUsername?a.ownerUsername===user.username:a.user===user.name}
function editReq(id){let a=(state.approvals||[]).find(x=>Number(x.id)===Number(id));if(!a||a.status!=='Bekliyor'||!owned(a))return toast('Bu kayıt düzenlenemez');$('editId').value=a.id;$('type').value=a.type;$('code').value=a.code||'';$('mat').value=a.materialName||'';$('qty').value=a.qty;$('company').value=a.company==='-'?'':a.company||'';$('doc').value=a.doc==='-'?'':a.doc||'';$('desc').value=a.desc==='-'?'':a.desc||'';$('formTitle').textContent='✎ Bekleyen Talebi Düzelt';$('saveBtn').textContent='Değişiklikleri Güncelle';smartMatch();show('form')}
function renderMine(){if(!user||!state)return;let a=(state.approvals||[]).filter(owned).slice().reverse();$('pendingN').textContent=a.filter(x=>x.status==='Bekliyor').length;$('list').innerHTML=a.length?a.map(x=>`<div class="item"><div class="row"><div><div class="strong">${esc(x.type)} • ${esc(x.code||'Serbest giriş')}</div><div>${esc(x.materialName)}</div>${x.unmatched?'<div class="muted">⚠ Stok/ürünle eşleşmedi • Admin eşleştirecek</div>':''}</div><span class="pill ${esc(x.status)}">${esc(x.status)}</span></div><div class="muted" style="margin-top:7px">${esc(x.date)} • ${fmt(x.qty)} ${esc(((state.materials||[]).find(m=>m.code===x.code)||{}).unit||'')}</div>${x.editedAt?`<div class="muted">✎ Düzenlendi: ${new Date(x.editedAt).toLocaleString('tr-TR')}</div>`:''}${x.status==='Bekliyor'?`<div class="actions"><button class="btn primary" onclick="editReq(${Number(x.id)})">✎ Düzelt</button></div>`:''}</div>`).join(''):'<div class="muted" style="padding:18px 0">Henüz gönderilmiş talep yok.</div>'}
function categoryOf(a){if(a.type==='Sevkiyat')return 'Mamul';let m=(state.materials||[]).find(x=>x.code===a.code);let raw=String(m?.category||m?.type||a.category||'').toLowerCase();if(raw.includes('mamul'))return 'Mamul';if(raw.includes('ürün')||raw.includes('urun'))return 'Ürün';return 'Hammadde'}
function setCat(v,b){catFilter=v;[...$('catFilters').children].forEach(x=>x.classList.remove('active'));b.classList.add('active');renderAdmin()}
function setStatus(v,b){statusFilter=v;[...$('statusFilters').children].forEach(x=>x.classList.remove('active'));b.classList.add('active');renderAdmin()}
function renderAdmin(){if(!isAdmin()||!state||!$('adminList'))return;let q=($('adminSearch')?.value||'').toLowerCase();let arr=(state.approvals||[]).slice().reverse().filter(a=>(catFilter==='Tümü'||categoryOf(a)===catFilter)&&(statusFilter==='Tümü'||a.status===statusFilter)&&(!q||[a.materialName,a.code,a.user,a.type].some(v=>String(v||'').toLowerCase().includes(q))));$('adminList').innerHTML=arr.length?arr.map(a=>`<div class="item"><div class="row"><div><div class="strong">${esc(categoryOf(a))} • ${esc(a.type)} • ${esc(a.code||'Eşleşmedi')}</div><div>${esc(a.materialName)}</div><div class="muted">${esc(a.user)} • ${fmt(a.qty)} • ${esc(a.date)}</div>${a.unmatched?'<div class="muted">⚠ Eşleşmemiş kayıt — onaydan önce düzelt/eşleştir</div>':''}</div><span class="pill ${esc(a.status)}">${esc(a.status)}</span></div>${a.status==='Bekliyor'?`<div class="adminActions"><button class="btn ghost mini" onclick="adminEdit(${Number(a.id)})">✎ Düzelt</button><button class="btn green mini" onclick="adminDecision(${Number(a.id)},'Onaylandı')">✓ Onayla</button><button class="btn red mini" onclick="adminDecision(${Number(a.id)},'Reddedildi')">✕ Reddet</button></div>`:''}</div>`).join(''):'<div class="muted" style="padding:18px 0">Bu filtrede kayıt yok.</div>'}
function adminEdit(id){let a=(state.approvals||[]).find(x=>Number(x.id)===Number(id));if(!a||a.status!=='Bekliyor')return toast('Bu kayıt düzenlenemez');$('editId').value=a.id;$('type').value=a.type;$('code').value=a.code||'';$('mat').value=a.materialName||'';$('qty').value=a.qty;$('company').value=a.company==='-'?'':a.company||'';$('doc').value=a.doc==='-'?'':a.doc||'';$('desc').value=a.desc==='-'?'':a.desc||'';$('formTitle').textContent='Yönetici • Talebi Düzelt';$('saveBtn').textContent='Değişiklikleri Güncelle';smartMatch();show('form')}
async function adminDecision(id,status){if(!isAdmin())return;try{await mutateApprovals((arr,fresh)=>{let a=arr.find(x=>Number(x.id)===Number(id));if(!a||a.status!=='Bekliyor')throw new Error('Kayıt artık beklemede değil');if(status==='Onaylandı'&&a.unmatched)throw new Error('Önce kaydı doğru stok/ürünle eşleştir');a.status=status;a.adminUser=user.name;a.adminAt=new Date().toISOString();if(status==='Onaylandı'&&(a.type==='Giriş'||a.type==='Çıkış')){fresh.movements=Array.isArray(fresh.movements)?fresh.movements:[];fresh.movements.push({id:Date.now(),date:new Date().toISOString().slice(0,10),user:a.user,type:a.type,code:a.code,qty:Number(a.qty),company:a.company||'-',doc:a.doc||'-',desc:a.desc||'-',source:'Mobil Yönetici Onayı'})}});toast(status==='Onaylandı'?'Talep onaylandı':'Talep reddedildi');show('admin')}catch(e){toast(e.message||'İşlem yapılamadı')}}
async function refresh(){if(!user)return;try{$('sync').textContent='🟡 Kontrol ediliyor…';let r=await read();state=r?.veri||state;lastUpdated=r?.updated_at||lastUpdated;$('sync').textContent='🟢 Buluta bağlı • Güncel';apply()}catch(e){$('sync').textContent='🔴 Bağlantı yok';toast('Güncel veriler alınamadı')}}
boot();setInterval(()=>{if(user)refresh()},8000);if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script></body></html>
