<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#20252b"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><title>Merkür Mobil • v0.6</title>
<style>
:root{--c:#B87333;--dark:#20252b;--bg:#f3f4f6;--green:#198754;--red:#c0392b}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:#252525}.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}.top{background:var(--dark);color:#fff;padding:15px 16px;position:sticky;top:0;z-index:5}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{font-weight:900;font-size:20px}.sub,.muted{font-size:12px;opacity:.72}.body{padding:16px 16px 95px}.card{border:1px solid #e4e4e4;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px #0000000d}h2{margin:0 0 12px;font-size:20px}label{display:block;font-weight:800;font-size:14px;margin:14px 0 6px}input,textarea{width:100%;padding:14px 12px;border:1px solid #cfd3d8;border-radius:11px;font-size:16px}textarea{min-height:90px}.btn{border:0;border-radius:12px;padding:14px;font-weight:900;font-size:15px}.wide{width:100%;margin-top:12px}.green{background:var(--green);color:#fff}.red{background:var(--red);color:#fff}.primary{background:var(--c);color:#fff}.ghost{background:#eceff2;color:#222}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{height:125px;font-size:18px}.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;padding:24px;background:var(--dark)}.loginbox{width:100%;background:#fff;border-radius:18px;padding:22px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:1fr 1fr;background:#fff;border-top:1px solid #ddd;padding:8px 5px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:none;padding:8px;font-weight:800}.item{border:1px solid #e2e5e8;border-radius:13px;padding:13px;margin:10px 0}.pill{padding:5px 9px;border-radius:999px;font-size:11px;font-weight:900}.Bekliyor{background:#fff3cd;color:#856404}.Onaylandı{background:#d1e7dd;color:#0f5132}.Reddedildi{background:#f8d7da;color:#842029}.strong{font-weight:900}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#20252b;color:#fff;padding:11px 14px;border-radius:10px;z-index:30;display:none;max-width:90%}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h2>MERKÜR Mobil</h2><div class="muted">Saha giriş / çıkış terminali • v0.6</div><label>Kullanıcı adı</label><input id="lu"><label>Şifre</label><input id="lp" type="password"><button class="btn primary wide" onclick="login()">Giriş Yap</button><div id="loginStatus" class="muted" style="margin-top:12px">Bulut verileri yükleniyor…</div></div></div>
<div id="app" class="app hidden"><header class="top"><div class="row"><div><div class="brand">MERKÜR • SAHA</div><div id="who" class="sub"></div></div><button class="btn red" style="padding:8px 10px;font-size:12px" onclick="logout()">Çıkış Yap</button></div><div id="sync" class="sub" style="margin-top:6px">🟡 Bağlanıyor…</div></header>
<main class="body">
<section id="home"><div class="card"><h2>Ne Yapacaksın?</h2><div class="choices"><button class="btn green" onclick="newReq('Giriş')">📥<br>STOK GİRİŞİ</button><button class="btn red" onclick="newReq('Çıkış')">📤<br>STOK ÇIKIŞI</button></div></div><div class="card"><div class="row"><div><div class="strong">Bekleyen Taleplerim</div><div class="muted">Onaylanana kadar düzenleyebilirsin.</div></div><div id="pendingN" style="font-size:30px;font-weight:900;color:var(--c)">0</div></div></div></section>
<section id="form" class="hidden"><div class="card"><h2 id="formTitle"></h2><input id="editId" type="hidden"><input id="type" type="hidden">
<label>Malzeme / Stok Açıklaması</label><input id="mat" placeholder="Örn: Gri sandalyenin siyah plastiği">
<label>Miktar</label><input id="qty" type="number" min="0.0001" step="any" inputmode="decimal" placeholder="0">
<label>Firma / Tedarikçi</label><input id="company" placeholder="Firma / tedarikçi adını yaz">
<label>Evrak / İrsaliye No</label><input id="doc" placeholder="Evrak / irsaliye numarasını yaz">
<label>Açıklama</label><textarea id="desc" placeholder="İşlemle ilgili açıklamayı yaz"></textarea>
<button class="btn primary wide" onclick="saveReq()">Onaya Gönder</button><button class="btn ghost wide" onclick="show('home')">Vazgeç</button></div></section>
<section id="mine" class="hidden"><div class="card"><div class="row"><div><h2>Gönderdiklerim</h2><div class="muted">Bekleyen talepler düzenlenebilir.</div></div><button class="btn ghost" onclick="refresh()">↻</button></div><div id="list"></div></div></section>
</main><nav class="nav"><button onclick="show('home')">⌂<br>Ana Sayfa</button><button onclick="show('mine')">☷<br>Gönderdiklerim</button></nav></div><div id="toast" class="toast"></div>
<script>
const URL='https://rtnrbuydjbaluorsljqv.supabase.co',KEY='sb_publishable_tDqC-wtkHK1Alet6KKqYrw_BvuEfwhZ',TABLE='stok_verileri',ROW='sistem_data',API=URL+'/rest/v1/'+TABLE;
let state=null,user=null;const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(n){return Number(n||0).toLocaleString('tr-TR',{maximumFractionDigits:3})}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}
async function apiFetch(url,opt={}){return fetch(url,{...opt,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal',...(opt.headers||{})}})}
async function read(){const r=await apiFetch(API+'?select=veri,updated_at&kod=eq.'+encodeURIComponent(ROW),{headers:{Accept:'application/json'}});if(!r.ok)throw Error('Bulut okuma hatası');return (await r.json())[0]||null}
async function boot(){try{state=(await read())?.veri||{};$('loginStatus').textContent='🟢 Sistem hazır';return true}catch{$('loginStatus').textContent='🔴 Bulut bağlantısı kurulamadı';return false}}
async function login(){if(!state&&!await boot())return;const k=$('lu').value.trim(),p=$('lp').value,u=state?.users?.[k];if(!u||u.pass!==p)return toast('Kullanıcı adı veya şifre hatalı');user={username:k,...u};$('who').textContent=(user.name||k)+' • '+k;$('login').classList.add('hidden');$('app').classList.remove('hidden');show('home');await refresh()}
function logout(){user=null;$('lu').value='';$('lp').value='';$('app').classList.add('hidden');$('login').classList.remove('hidden');$('loginStatus').textContent='🟢 Oturum kapatıldı'}
function show(id){['home','form','mine'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='mine')refresh();renderMine()}
function newReq(t){$('editId').value='';$('type').value=t;$('mat').value='';$('qty').value='';$('company').value='';$('doc').value='';$('desc').value='';$('formTitle').textContent=t==='Giriş'?'📥 Stok Girişi':'📤 Stok Çıkışı';show('form')}
async function mutate(fn){$('sync').textContent='🟡 Güncelleniyor…';const fresh=clone((await read())?.veri||{});fresh.approvals=Array.isArray(fresh.approvals)?fresh.approvals:[];fn(fresh.approvals);const wr=await apiFetch(API+'?on_conflict=kod',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({kod:ROW,veri:fresh,updated_at:new Date().toISOString()})});if(!wr.ok)throw Error('Bulut kayıt hatası');state=fresh;$('sync').textContent='🟢 Senkronize';renderMine()}
async function saveReq(){const name=$('mat').value.trim(),q=Number(String($('qty').value).replace(',','.'));if(!name)return toast('Malzeme / stok açıklamasını yaz');if(!Number.isFinite(q)||q<=0)return toast('Geçerli miktar gir');const company=$('company').value.trim(),doc=$('doc').value.trim(),desc=$('desc').value.trim();if(!company)return toast('Firma / tedarikçi bilgisini yaz');if(!doc)return toast('Evrak / irsaliye numarasını yaz');if(!desc)return toast('Açıklama alanını doldur');const eid=Number($('editId').value||0),type=$('type').value;try{await mutate(arr=>{const data={date:new Date().toISOString().slice(0,10),user:user.name||user.username,ownerUsername:user.username,type,direction:type,materialName:name,code:'',unmatched:true,company,qty:q,doc,desc,status:'Bekliyor',source:'Mobil Saha v0.6'};if(eid){const a=arr.find(x=>Number(x.id)===eid);if(!a||a.status!=='Bekliyor')throw Error('Kayıt artık düzenlenemez');Object.assign(a,data,{editedAt:new Date().toISOString(),editedBy:user.name||user.username})}else arr.push({id:Date.now(),...data})});toast('Talep Onay Defteri’ne gönderildi');show('mine')}catch(e){toast(e.message||'Gönderilemedi')}}
function owned(a){return user&&(a.ownerUsername?a.ownerUsername===user.username:a.user===user.name)}
function renderMine(){if(!user||!state)return;const arr=(state.approvals||[]).filter(owned).slice().reverse();$('pendingN').textContent=arr.filter(x=>x.status==='Bekliyor').length;$('list').innerHTML=arr.length?arr.map(a=>`<div class="item"><div class="row"><div><div class="strong">${a.type==='Giriş'?'📥':'📤'} ${esc(a.type)} • ${esc(a.materialName)}</div><div class="muted">${esc(a.date)} • ${fmt(a.qty)} • ${esc(a.company||'')}</div></div><span class="pill ${esc(a.status)}">${esc(a.status)}</span></div>${a.status==='Bekliyor'?`<button class="btn ghost wide" onclick="editReq(${Number(a.id)})">Düzelt</button>`:''}</div>`).join(''):'<div class="muted">Henüz talep yok.</div>'}
function editReq(id){const a=(state.approvals||[]).find(x=>Number(x.id)===Number(id));if(!a||a.status!=='Bekliyor')return toast('Bu kayıt düzenlenemez');$('editId').value=a.id;$('type').value=a.type;$('mat').value=a.materialName||'';$('qty').value=a.qty||'';$('company').value=a.company==='-'?'':a.company||'';$('doc').value=a.doc==='-'?'':a.doc||'';$('desc').value=a.desc==='-'?'':a.desc||'';$('formTitle').textContent='✏️ '+a.type+' Talebini Düzelt';show('form')}
async function refresh(){if(!user)return;try{$('sync').textContent='🟡 Kontrol ediliyor…';state=(await read())?.veri||state;$('sync').textContent='🟢 Buluta bağlı • Güncel';renderMine()}catch{$('sync').textContent='🔴 Bağlantı yok'}}
boot();setInterval(()=>{if(user)refresh()},8000);if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
</script></body></html>
